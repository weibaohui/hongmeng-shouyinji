<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>收音机 · 界面重设计预览（横屏 / 竖屏）</title>
<style>
  :root{
    --bg:#0B1017; --surface:#111925; --surface2:#172231; --card:#1B2839;
    --border:#26354A; --text:#E8EFF8; --dim:#8FA2B8; --faint:#5B6B80;
    --blue:#4C9AFF; --green:#3DDC84; --gold:#F5C24B; --red:#F2637B;
    --selected:#182C44; --vizbg:#0E1723;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:#EDF1F6;color:#1E2A3A;font-family:"HarmonyOS Sans","PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input{font-family:inherit}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-thumb{background:#2B3B50;border-radius:6px}
  ::-webkit-scrollbar-track{background:transparent}

  /* ---------- 外层：设计稿展示台 ---------- */
  .topbar{display:flex;align-items:center;gap:14px;padding:16px 24px;background:#fff;border-bottom:1px solid #DDE4EC;flex-wrap:wrap}
  .topbar h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px}
  .topbar .sub{font-size:12px;color:#7A889C;margin-left:2px}
  .seg{display:flex;background:#F1F4F8;border:1px solid #E1E7EF;border-radius:10px;padding:3px;gap:2px}
  .seg button{font-size:12px;padding:7px 14px;border-radius:7px;color:#5C6B80;white-space:nowrap}
  .seg button.on{background:#fff;color:#1B63D6;box-shadow:0 1px 4px rgba(20,40,70,.12);font-weight:600}
  .topbar .spacer{flex:1}
  .tool{display:flex;align-items:center;gap:8px;font-size:12px;color:#5C6B80}
  .tool select{font-size:12px;padding:7px 10px;border:1px solid #DDE4EC;border-radius:8px;background:#fff;color:#334155;outline:none}
  .stage{display:flex;gap:24px;align-items:flex-start;padding:28px 24px 60px;overflow:auto;min-height:calc(100vh - 68px)}
  .unit{flex:none}
  .unit .cap{display:flex;align-items:baseline;gap:8px;margin:0 0 10px 2px;font-size:12px;color:#5C6B80}
  .unit .cap b{font-size:13px;color:#26364B;font-weight:650}
  .wrap{position:relative;overflow:hidden;border-radius:22px;box-shadow:0 18px 44px rgba(17,32,54,.22),0 2px 8px rgba(17,32,54,.12);border:1px solid #2A384C;background:var(--bg)}
  .frame{position:absolute;top:0;left:0;transform-origin:top left;overflow:hidden;background:var(--bg);color:var(--text)}
  .frame.landscape{width:1280px;height:800px}
  .frame.portrait{width:800px;height:1280px}

  /* ---------- 应用通用 ---------- */
  .app{height:100%;display:flex;flex-direction:column;background:var(--bg);font-size:16px;position:relative}
  .statusbar{height:32px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
  .sb-right{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:12px}
  .battery{width:20px;height:10px;border:1.5px solid var(--faint);border-radius:3px;position:relative;display:inline-block}
  .battery:after{content:"";position:absolute;right:-4px;top:2px;width:2px;height:4px;background:var(--faint);border-radius:0 2px 2px 0}
  .battery i{position:absolute;left:1.5px;top:1.5px;bottom:1.5px;width:13px;background:var(--dim);border-radius:1px}
  .body{flex:1;min-height:0;position:relative;overflow:hidden}
  .ic{flex:none;vertical-align:middle}
  .muted{color:var(--faint)}
  .hidden{display:none !important}

  /* 导航 rail */
  .nav{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:24px 16px 24px;min-width:0}
  .brand{display:flex;align-items:center;gap:12px;height:64px;flex:none;padding:0 8px}
  .brand .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,#4C9AFF,#2C5FBF);display:flex;align-items:center;justify-content:center;color:#fff}
  .brand b{font-size:19px;letter-spacing:1px}
  .nav-group{margin-top:24px;display:flex;flex-direction:column;gap:8px}
  .nav-item{height:56px;flex:none;display:flex;align-items:center;gap:12px;padding:0 14px;border-radius:12px;color:var(--dim);position:relative;text-align:left;font-size:17px;white-space:nowrap}
  .nav-item:hover{background:var(--surface2)}
  .nav-item.on{background:var(--selected);color:var(--text)}
  .nav-item.on:before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:3px;border-radius:2px;background:var(--blue)}
  .nav-item.on .ic{color:var(--blue)}
  .nav-item .cnt{margin-left:auto;flex:none;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
  .nav .spacer{flex:1}
  .nav-foot{flex:none;height:56px;display:flex;align-items:center;gap:12px;padding:0 14px;border-radius:12px;color:var(--dim);font-size:17px}
  .nav-foot:hover{background:var(--surface2);color:var(--text)}

  /* 电台列表栏 */
  .list{background:var(--bg);border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0;padding:24px 24px 16px;position:relative}
  .search{height:48px;flex:none;display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:24px;padding:0 16px;color:var(--faint)}
  .search input{flex:1;min-width:0;border:none;outline:none;background:none;color:var(--text);font-size:15px}
  .search input::placeholder{color:var(--faint)}
  .filter-bar{height:48px;flex:none;display:flex;align-items:center;gap:10px;margin-top:24px}
  .filter-btn{height:48px;display:flex;align-items:center;gap:8px;padding:0 16px;border-radius:12px;background:var(--surface2);color:var(--dim);font-size:15px}
  .filter-btn.on{color:var(--blue);background:var(--selected)}
  .filter-btn .arrow{margin-left:2px;transition:transform .2s}
  .filter-btn.on .arrow{transform:rotate(180deg)}
  .filter-summary{flex:1;min-width:0;font-size:14px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .tag{display:flex;align-items:center;gap:6px;height:34px;padding:0 10px 0 12px;border-radius:17px;background:var(--selected);color:var(--blue);font-size:13px}
  .tag button{color:var(--blue);display:flex;opacity:.75}
  .count{flex:none;height:40px;display:flex;align-items:center;font-size:14px;color:var(--dim);margin-top:12px}
  .count b{color:var(--text);font-weight:600;margin:0 4px;font-variant-numeric:tabular-nums}
  .rows{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding-right:4px}
  .row{height:60px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:12px;background:var(--surface);cursor:pointer}
  .row:hover{background:var(--surface2)}
  .row.on{background:var(--selected)}
  .row .bar{width:3px;height:22px;border-radius:2px;background:var(--green);flex:none;opacity:0}
  .row.on .bar{opacity:1}
  .row .no{width:26px;flex:none;text-align:center;font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums}
  .row .info{flex:1;min-width:0}
  .row .nm{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row.on .nm{color:var(--blue)}
  .row .sb{font-size:13px;color:var(--dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .star{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--faint);border-radius:10px}
  .star:hover{background:rgba(255,255,255,.05)}
  .star.on{color:var(--gold)}
  .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--dim);font-size:15px}
  .empty .big{font-size:44px;color:var(--border)}
  .empty button{color:var(--blue);font-size:14px;padding:8px 16px;border-radius:10px;background:var(--surface2)}

  /* 筛选浮层 */
  .filter-pop{position:absolute;left:24px;right:24px;top:152px;z-index:6;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:0 18px 40px rgba(0,0,0,.45)}
  .filter-pop .ttl{font-size:13px;color:var(--faint);margin-bottom:10px}
  .filter-pop .grp{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
  .filter-pop .grp:last-child{margin-bottom:0}
  .chip{font-size:14px;padding:8px 14px;border-radius:18px;background:var(--surface2);color:var(--dim);white-space:nowrap}
  .chip.on{background:var(--blue);color:#fff}
  .filter-pop .foot{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;border-top:1px solid var(--border);padding-top:14px}
  .filter-pop .foot button{font-size:14px;padding:8px 16px;border-radius:10px;color:var(--dim)}
  .filter-pop .foot .ok{background:var(--blue);color:#0B1017;font-weight:600}

  /* 播放器栏 */
  .player{display:flex;flex-direction:column;gap:24px;padding:24px 24px 32px;min-width:0;background:var(--bg)}
  .np{flex:none;display:flex;align-items:flex-start;gap:20px;min-height:96px}
  .np .info{flex:1;min-width:0;padding-top:4px}
  .np .nm{font-size:30px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .np .sb{font-size:14px;color:var(--dim);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .np .right{flex:none;display:flex;align-items:center;gap:10px;padding-top:8px}
  .pill{height:40px;display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:20px;background:var(--surface2);color:var(--dim);font-size:14px;white-space:nowrap}
  .pill i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
  .pill.playing{color:var(--green)} .pill.playing i{background:var(--green)}
  .pill.loading{color:var(--blue)} .pill.loading i{background:var(--blue)}
  .pill.error{color:var(--red)} .pill.error i{background:var(--red)}
  .live{font-size:12px;font-weight:700;letter-spacing:.6px;color:#0B1017;background:var(--green);padding:5px 10px;border-radius:6px}
  .live.off{background:var(--surface2);color:var(--faint)}
  .np .star{width:44px;height:44px}
  .viz{flex:1;min-height:0;position:relative;border-radius:16px;background:var(--vizbg);overflow:hidden}
  .viz canvas{display:block;width:100%;height:100%}
  .viz .vz-tag{position:absolute;left:16px;bottom:12px;font-size:12px;color:var(--faint);letter-spacing:.5px}
  .viz .vz-clock{position:absolute;right:16px;bottom:12px;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
  .retry{flex:none;display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;background:rgba(242,99,123,.12);color:var(--red);font-size:14px}
  .retry button{margin-left:auto;background:var(--red);color:#0B1017;font-size:14px;font-weight:600;padding:8px 18px;border-radius:9px}
  .controls{flex:none;display:flex;align-items:center;justify-content:center;gap:32px}
  .ctrl{width:56px;height:56px;border-radius:28px;background:var(--card);color:var(--text);display:flex;align-items:center;justify-content:center}
  .ctrl:hover{background:var(--surface2)}
  .play{width:88px;height:88px;border-radius:44px;background:var(--blue);color:#0B1017;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 24px rgba(76,154,255,.28)}
  .play.on{background:var(--green);box-shadow:0 6px 24px rgba(61,220,132,.25)}
  .secondary{flex:none;display:flex;align-items:center;gap:16px;height:64px}
  .vol{display:flex;align-items:center;gap:12px;flex:1;min-width:0;color:var(--dim)}
  .vol input{flex:1;min-width:0;accent-color:var(--blue);height:4px}
  .vol b{width:44px;text-align:right;color:var(--text);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
  .mini{height:44px;min-width:44px;padding:0 12px;border-radius:12px;background:var(--surface2);color:var(--dim);display:flex;align-items:center;justify-content:center;gap:7px;font-size:14px;white-space:nowrap}
  .mini.on{color:var(--gold);background:#3A2E12}
  .mini.act{color:var(--blue);background:var(--selected)}
  .neighbors{flex:none;display:flex;gap:16px}
  .neighbor{flex:1;min-width:0;height:96px;background:var(--card);border-radius:12px;padding:16px;display:flex;flex-direction:column;justify-content:center;cursor:pointer}
  .neighbor:hover{background:var(--surface2)}
  .neighbor small{font-size:13px;color:var(--faint);display:flex;align-items:center;gap:6px}
  .neighbor small em{font-style:normal;color:var(--blue)}
  .neighbor div{font-size:15px;color:var(--dim);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* 横屏：三栏 */
  .landscape .body{display:grid;grid-template-columns:200px 424px minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
  .landscape .body > *{display:flex;min-height:0;min-width:0}
  .landscape .nav{display:flex}
  .landscape .tabs{display:none}
  .landscape .settings-pane{display:none}

  /* 竖屏：单栏 + 底部页签 */
  .portrait .body{display:block}
  .portrait .body > *{display:none;height:100%}
  .portrait .body > .visible{display:flex}
  .portrait .nav{display:none}
  .portrait .list{border-right:0;padding:24px 28px 16px}
  .portrait .player{padding:24px 28px 28px;gap:24px}
  .portrait .np .nm{font-size:34px}
  .portrait .controls{gap:48px}
  .portrait .tabs{height:96px;flex:none;display:flex;background:var(--surface);border-top:1px solid var(--border)}
  .portrait .tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--dim);font-size:14px}
  .portrait .tabs button.on{color:var(--blue)}
  .settings-pane{flex-direction:column;overflow-y:auto;padding:24px 28px}
  .settings-pane h2{font-size:26px;margin:0 0 24px}
  .set-sec{margin-bottom:26px}
  .set-sec .ttl{font-size:13px;color:var(--faint);margin-bottom:12px;letter-spacing:.5px}
  .set-grid{display:flex;flex-wrap:wrap;gap:8px}
  .set-grid button{font-size:14px;padding:10px 14px;border-radius:10px;background:var(--surface2);color:var(--dim)}
  .set-grid button.on{background:var(--blue);color:#0B1017;font-weight:600}
  .set-row{display:flex;align-items:center;height:64px;padding:0 16px;background:var(--surface);border-radius:12px;font-size:16px;margin-bottom:8px}
  .set-row .sw{margin-left:auto;width:48px;height:26px;border-radius:13px;background:#3A485C;position:relative}
  .set-row .sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
  .set-row .sw.on{background:var(--blue)} .set-row .sw.on i{left:25px}

  /* 横屏设置抽屉 */
  .mask{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:8}
  .drawer{position:absolute;top:0;right:0;bottom:0;width:400px;background:var(--surface);border-left:1px solid var(--border);z-index:9;display:flex;flex-direction:column}
  .drawer .dh{flex:none;height:88px;display:flex;align-items:center;padding:0 28px;border-bottom:1px solid var(--border)}
  .drawer .dh b{font-size:22px}
  .drawer .dh button{margin-left:auto;color:var(--blue);font-size:15px}
  .drawer .dc{flex:1;min-height:0;overflow-y:auto;padding:24px 28px 32px}
  .drawer .set-sec{margin-bottom:22px}
  .drawer .set-grid button{font-size:13px;padding:9px 12px}
  .drawer .set-row{height:56px;font-size:15px}

  /* 字幕浮层 */
  .caption{position:absolute;left:8%;right:8%;bottom:12%;z-index:7;background:rgba(11,16,23,.86);border:1px solid var(--border);border-radius:14px;padding:16px 20px;font-size:18px;color:var(--text);text-align:center;line-height:1.6}

  /* 竖屏页签内容切换由 JS 加 .visible */
  .portrait .filter-pop{left:28px;right:28px;top:152px}
</style>
</head>
<body>

<div class="topbar">
  <h1>收音机 · 界面重设计预览</h1>
  <span class="sub">深色 / 简洁大方 / 横屏 + 竖屏</span>
  <div class="seg" id="modeSeg">
    <button data-mode="both" class="on">并排对比</button>
    <button data-mode="landscape">横屏</button>
    <button data-mode="portrait">竖屏</button>
  </div>
  <div class="spacer"></div>
  <label class="tool">状态
    <select id="stateSel">
      <option value="playing">播放中</option>
      <option value="loading">加载中</option>
      <option value="error">播放失败</option>
      <option value="idle">未播放</option>
      <option value="paused">已暂停</option>
    </select>
  </label>
</div>

<div class="stage" id="stage" data-mode="both">
  <div class="unit" id="unitL">
    <div class="cap"><b>横屏 · 三栏</b><span>1280 × 800 vp</span></div>
    <div class="wrap" id="wrapL"><div class="frame landscape" id="frameL"></div></div>
  </div>
  <div class="unit" id="unitP">
    <div class="cap"><b>竖屏 · 单栏</b><span>800 × 1280 vp</span></div>
    <div class="wrap" id="wrapP"><div class="frame portrait" id="frameP"></div></div>
  </div>
</div>

<script>
/* 兜底数据：预览环境若无法加载同目录 stations.js，也能完整展示界面 */
const FALLBACK = [
  {id:1,name:'北京文艺广播',province:'北京',city:'北京',genre:'文艺',countryCode:'CN'},
  {id:2,name:'北京音乐广播',province:'北京',city:'北京',genre:'音乐',countryCode:'CN'},
  {id:3,name:'中央人民广播电台 中国之声',province:'北京',city:'北京',genre:'新闻',countryCode:'CN'},
  {id:4,name:'上海东方广播 动感101',province:'上海',city:'上海',genre:'音乐',countryCode:'CN'},
  {id:5,name:'广东珠江经济台',province:'广东',city:'广州',genre:'经济',countryCode:'CN'},
  {id:6,name:'浙江交通之声 FM93',province:'浙江',city:'杭州',genre:'交通',countryCode:'CN'},
  {id:7,name:'江苏经典流行音乐广播',province:'江苏',city:'南京',genre:'音乐',countryCode:'CN'},
  {id:8,name:'四川新闻广播 FM98.1',province:'四川',city:'成都',genre:'新闻',countryCode:'CN'},
  {id:9,name:'新疆新闻广播 FM96.1',province:'新疆',city:'乌鲁木齐',genre:'新闻',countryCode:'CN'},
  {id:10,name:'BBC World Service',province:'',city:'',genre:'新闻',countryCode:'GB'},
  {id:11,name:'Classic FM',province:'',city:'',genre:'音乐',countryCode:'GB'},
  {id:12,name:'NHK World Radio Japan',province:'',city:'',genre:'新闻',countryCode:'JP'}
];
</script>
<script src="stations.js"></script>
<script>
const STATIONS = (window.RADIO_STATIONS && window.RADIO_STATIONS.length) ? window.RADIO_STATIONS : FALLBACK;

const ICONS = {
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/>',
  filter:'<path d="M4 6h16M7 12h10M10 18h4"/>',
  close:'<path d="M6 6l12 12M18 6L6 18"/>',
  chevron:'<path d="M6 9l6 6 6-6"/>',
  star:'<path d="M12 3.2l2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9L12 3.2z"/>',
  prev:'<path d="M19 5.5v13L9 12l10-6.5z"/><path d="M5 5v14"/>',
  next:'<path d="M5 5.5v13l10-6.5-10-6.5z"/><path d="M19 5v14"/>',
  play:'<path d="M8 5.5l11 6.5-11 6.5v-13z"/>',
  pause:'<path d="M8 5v14M16 5v14"/>',
  volume:'<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9.2a4 4 0 010 5.6"/>',
  sleep:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5.5l3.2 2"/>',
  shuffle:'<path d="M4 6h3l10 12h3M4 18h3l3-3.5M14 9.5l3-3.5h3"/><path d="M18 3.5l2 2.5-2 2.5M18 15.5l2 2.5-2 2.5"/>',
  caption:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M7 11h3M7 14.5h7M14.5 11h2.5"/>',

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function topN(key,n){
  const m=new Map();
  STATIONS.forEach(s=>{const v=(s[key]||'').trim();if(v&&v!=='全部')m.set(v,(m.get(v)||0)+1);});
  return [...m.entries()].sort((a,b)=>b[1]-a[1]).slice(0,n).map(e=>e[0]);
}

function filtered(){
  let a=STATIONS;
  if(state.scope==='fav')a=a.filter(s=>state.favorites.has(s.id));
  else if(state.scope==='cn')a=a.filter(s=>s.countryCode==='CN');
  else if(state.scope==='intl')a=a.filter(s=>s.countryCode!=='CN');
  if(state.province!=='全部')a=a.filter(s=>(s.province||'')===state.province);
  if(state.genre!=='全部')a=a.filter(s=>(s.genre||'')===state.genre);
  const k=state.keyword.trim().toLowerCase();
  if(k)a=a.filter(s=>((s.name||'')+(s.province||'')+(s.city||'')+(s.genre||'')).toLowerCase().indexOf(k)>=0);
  return a;
}

function scopeCount(k){

function renderAll(){
  const scroll={};
  document.querySelectorAll('[data-role="rows"]').forEach((el,i)=>scroll[el.closest('.frame').id]=el.scrollTop);
  const active=document.activeElement;
  const focusKey=active&&active.dataset?active.dataset.role:null;
  const focusVal=active&&active.selectionStart!=null?active.selectionStart:null;
  const l=document.getElementById('frameL'),p=document.getElementById('frameP');
  l.innerHTML=frameHTML('landscape');
  p.innerHTML=frameHTML('portrait');
  document.querySelectorAll('[data-role="rows"]').forEach(el=>{if(scroll[el.closest('.frame').id]!=null)el.scrollTop=scroll[el.closest('.frame').id];});
  if(focusKey==='search'){
    const el=document.querySelector('[data-role="search"]');
    if(el){el.focus();if(focusVal!=null)try{el.setSelectionRange(focusVal,focusVal);}catch(e){}}
  }
}
function renderLists(){
  document.querySelectorAll('[data-role="rows"]').forEach(el=>el.innerHTML=rowsHTML());
  document.querySelectorAll('[data-role="count"]').forEach(el=>el.textContent=filtered().length);
}

/* ---------- 交互 ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el)return;
  const a=el.dataset.act,v=el.dataset.v;
  switch(a){
    case 'scope': state.scope=v; renderAll(); break;
    case 'station':{const id=+el.dataset.id;state.currentId=id;state.playState='playing';if(state.mode!=='both'&&document.getElementById('stage').dataset.mode==='portrait')state.pane='play';renderAll();break;}
    case 'fav':{e.stopPropagation();const id=+el.dataset.id;state.favorites.has(id)?state.favorites.delete(id):state.favorites.add(id);renderAll();break;}
    case 'filter': state.filterOpen=!state.filterOpen; renderAll(); break;
    case 'filterclose': state.filterOpen=false; renderAll(); break;
    case 'pick': state[el.dataset.k]=v; renderAll(); break;
    case 'tagremove': state[el.dataset.k]='全部'; renderAll(); break;
    case 'reset': state.province='全部';state.genre='全部';state.keyword='';state.scope='all';state.filterOpen=false;renderAll(); break;
    case 'clearsearch': state.keyword='';renderAll();break;
    case 'toggleplay': state.playState=state.playState==='playing'?'paused':'playing';document.getElementById('stateSel').value=state.playState;renderAll();break;
    case 'step': case 'neighbor':{
      const d=+(el.dataset.d),arr=filtered(),i=arr.findIndex(s=>s.id===state.currentId);
      let t;
      if(state.random)t=arr[Math.floor(Math.random()*arr.length)];
      else if(i>=0)t=arr[(i+d+arr.length)%arr.length];
      else t=arr[0];
      if(t){state.currentId=t.id;state.playState='playing';}
      renderAll();break;
    }
    case 'retry': state.playState='loading';document.getElementById('stateSel').value='loading';renderAll();setTimeout(()=>{state.playState='playing';document.getElementById('stateSel').value='playing';renderAll();},900);break;
    case 'sleep': state.sleepIdx=(state.sleepIdx+1)%SLEEPS.length;renderAll();break;
    case 'random': state.random=!state.random;renderAll();break;
    case 'caption': state.caption=!state.caption;renderAll();break;
    case 'syseffect': state.systemEffect=!state.systemEffect;renderAll();break;
    case 'settings': state.settingsOpen=true;renderAll();break;
    case 'settingsclose': state.settingsOpen=false;renderAll();break;
    case 'pane': state.pane=v;renderAll();break;
    case 'sound': case 'fade': case 'viz': case 'theme':{
      const key=a==='sound'?'sound':a==='fade'?'fade':a==='viz'?'viz':'theme';
      state[key]=+v;renderAll();break;
    }
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.role==='search'){
    const pos=t.selectionStart;
    state.keyword=t.value;
    renderLists();
    const el=t;try{el.setSelectionRange(pos,pos);}catch(err){}
  }else if(t.dataset.role==='vol'){
    state.volume=+t.value;
    document.querySelectorAll('[data-role="volnum"]').forEach(x=>x.textContent=state.volume);
    document.querySelectorAll('[data-role="vol"]').forEach(x=>{if(x!==t)x.value=state.volume;});
  }else if(t.dataset.role==='loud'){
    state.loudness=+t.value;
    const b=t.parentElement.querySelector('b');if(b)b.textContent=state.loudness+' dB';
  }
});
document.getElementById('stateSel').addEventListener('change',e=>{state.playState=e.target.value;renderAll();});
document.getElementById('modeSeg').addEventListener('click',e=>{
  const b=e.target.closest('button[data-mode]');if(!b)return;

const SCALES={both:{l:.72,p:.45},landscape:{l:.92,p:0},portrait:{l:0,p:.62}};
function applyMode(){
  const m=state.mode,s=SCALES[m],st=document.getElementById('stage');
  st.dataset.mode=m;
  const L={w:1280,h:800},P={w:800,h:1280};
  const set=(unit,wrap,frame,dim,scale)=>{
    const u=document.getElementById(unit),w=document.getElementById(wrap),f=document.getElementById(frame);
    if(!scale){u.style.display='none';return;}
    u.style.display='';
    f.style.transform='scale('+scale+')';
    w.style.width=Math.round(dim.w*scale)+'px';
    w.style.height=Math.round(dim.h*scale)+'px';
  };
  set('unitL','wrapL','frameL',L,s.l);
  set('unitP','wrapP','frameP',P,s.p);
  if(m==='both'){
    document.getElementById('unitP').style.marginTop='0px';
  }
}

/* ---------- 频谱动画 ---------- */
const BARS=42;
let phase=0;
const THEME_COLORS={
  0:['#4C9AFF','#6FD3FF','#3DDC84','#F5C24B','#F2637B'],
  1:['#8FA2B8','#C7D4E4','#E8EFF8','#6B7C92','#A9BACE'],
  2:['#7C6BFF','#FF6BD6','#4C9AFF','#3DDC84','#F5C24B'],
  3:['#3DDC84','#7CFFB2','#C6FF4A','#F5C24B','#F2637B'],
  4:['#F5C24B','#FFD77A','#E89B2C','#B96F1A','#FFE9B0']
};
function draw(){
  phase+=0.045;
  document.querySelectorAll('canvas.spectrum').forEach(cv=>{
    const w=cv.clientWidth,h=cv.clientHeight;
    if(!w||!h)return;
    if(cv.width!==Math.round(w)||cv.height!==Math.round(h)){cv.width=Math.round(w);cv.height=Math.round(h);}
    const ctx=cv.getContext('2d');ctx.clearRect(0,0,w,h);
    const cols=THEME_COLORS[state.theme]||THEME_COLORS[0];
    const active=state.playState==='playing';
    const vals=[];
    for(let i=0;i<BARS;i++){
      const base=active?(0.22+0.5*Math.abs(Math.sin(phase*0.9+i*0.42))+0.24*Math.abs(Math.sin(phase*2.1+i*0.17))):0.05;
      vals.push(Math.min(1,base));
    }
    const bw=w/BARS;
    if(state.viz===2){ // LED 点阵
      const rowsN=12,ch=h/rowsN;
      for(let i=0;i<BARS;i++){
        const n=Math.round(vals[i]*rowsN);
        for(let r=0;r<n;r++){
          ctx.fillStyle=cols[(i+r)%cols.length];ctx.globalAlpha=r<rowsN*.6?.9:.55;
          ctx.fillRect(i*bw+bw*.18,h-(r+1)*ch+ch*.18,bw*.64,ch*.64);
        }
      }
      ctx.globalAlpha=1;
    }else if(state.viz===0){ // 双向镜像
      for(let i=0;i<BARS;i++){
        const bh=vals[i]*h*.46;
        ctx.fillStyle=cols[i%cols.length];
        ctx.fillRect(i*bw+bw*.16,h/2-bh,bw*.68,bh);
        ctx.globalAlpha=.45;ctx.fillRect(i*bw+bw*.16,h/2,bw*.68,bh*.85);ctx.globalAlpha=1;
      }
    }else if(state.viz===3||state.viz===4){ // 波峰
      ctx.beginPath();
      for(let i=0;i<BARS;i++){
        const x=i*bw+bw/2,y=h*.5-vals[i]*h*.4*Math.sin(Math.PI*i/(BARS-1))-h*.06;
        i?ctx.lineTo(x,y):ctx.moveTo(x,y);
      }
      ctx.lineWidth=3;ctx.strokeStyle=cols[0];ctx.stroke();
      ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.closePath();
      const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'rgba(76,154,255,.28)');g.addColorStop(1,'rgba(76,154,255,0)');ctx.fillStyle=g;ctx.fill();
    }else if(state.viz===5){ // 环形雷达
      const cx=w/2,cy=h/2,R=Math.min(w,h)*.36;
      ctx.strokeStyle='rgba(143,162,184,.18)';ctx.lineWidth=1;
      [.35,.65,1].forEach(k=>{ctx.beginPath();ctx.arc(cx,cy,R*k,0,Math.PI*2);ctx.stroke();});
      ctx.beginPath();
      for(let i=0;i<BARS;i++){
        const ang=(i/BARS)*Math.PI*2-Math.PI/2, r=R*(.32+vals[i]*.68);
        const x=cx+Math.cos(ang)*r,y=cy+Math.sin(ang)*r;
        i?ctx.lineTo(x,y):ctx.moveTo(x,y);
      }
      ctx.closePath();ctx.fillStyle='rgba(76,154,255,.2)';ctx.fill();
      ctx.strokeStyle=cols[0];ctx.lineWidth=2;ctx.stroke();
    }else if(state.viz===6){ // 瀑布流
      const rn=14,ch=h/rn;
      for(let r=0;r<rn;r++)for(let i=0;i<BARS;i++){
        const v=Math.max(0,Math.min(1,vals[i]*(1-r/rn*.7)+.05*Math.sin(phase+r*.4+i*.3)));
        ctx.globalAlpha=.16+v*.72;ctx.fillStyle=cols[(i+r)%cols.length];
        ctx.fillRect(i*bw+bw*.16,h-(r+1)*ch,bw*.68,ch*.72);
      }
      ctx.globalAlpha=1;
    }else if(state.viz===7){ // 粒子散落
      for(let i=0;i<BARS;i++){
        const n=Math.round(vals[i]*7)+1;
        for(let j=0;j<n;j++){
          const x=i*bw+bw*.5+Math.sin(phase*1.3+i+j)*bw*.3;
          const y=h-vals[i]*h*.85*((j+.5)/n)+Math.cos(phase+i)*4;
          ctx.globalAlpha=.35+vals[i]*.6;ctx.fillStyle=cols[(i+j)%cols.length];
          ctx.beginPath();ctx.arc(x,y,2.2,0,Math.PI*2);ctx.fill();
        }
      }
      ctx.globalAlpha=1;
    }else if(state.viz===8){ // 分贝电平
      const rn=10,ch=h/rn;
      for(let r=0;r<rn;r++){
        const level=vals[Math.floor(r/rn*BARS)],n=Math.round(level*BARS);
        ctx.fillStyle=level>.8?cols[4]:cols[0];ctx.globalAlpha=.16+level*.74;
        ctx.fillRect(0,h-(r+1)*ch+2,n*bw,ch-4);
      }
      ctx.globalAlpha=1;
      ctx.fillStyle='rgba(232,239,248,.55)';ctx.font='13px sans-serif';
      ctx.fillText('VOL '+state.volume+'%',12,22);
    }else{ // 经典柱状
      for(let i=0;i<BARS;i++){
        const bh=vals[i]*h*.82;
        const g=ctx.createLinearGradient(0,h,0,h-bh);
        g.addColorStop(0,cols[i%cols.length]+'44');g.addColorStop(1,cols[i%cols.length]);
        ctx.fillStyle=g;ctx.fillRect(i*bw+bw*.14,h-bh,bw*.72,bh);
        ctx.fillStyle=cols[i%cols.length];ctx.fillRect(i*bw+bw*.14,h-bh-3,bw*.72,3);
      }
    }
  });
  requestAnimationFrame(draw);
}
setInterval(()=>{
  const d=new Date(),hh=String(d.getHours()).padStart(2,'0'),mm=String(d.getMinutes()).padStart(2,'0');
  document.querySelectorAll('#clk').forEach(x=>x.textContent=hh+':'+mm);
  document.querySelectorAll('[data-role="vzclock"]').forEach(x=>x.textContent=hh+':'+mm);
},1000);

/* URL 参数：?mode=landscape|portrait|both  ?settings=1  ?pane=radio|play|settings */
const params=new URLSearchParams(location.search);
const qm=params.get('mode');
if(qm&&SCALES[qm]){
  state.mode=qm;
  document.querySelectorAll('#modeSeg button').forEach(x=>x.classList.toggle('on',x.dataset.mode===qm));
}
if(params.get('settings')==='1')state.settingsOpen=true;
if(params.get('filter')==='1')state.filterOpen=true;
if(params.get('pane'))state.pane=params.get('pane');
if(params.get('state')){
  state.playState=params.get('state');
  document.getElementById('stateSel').value=state.playState;
}
renderAll();
applyMode();
requestAnimationFrame(draw);
</script>
